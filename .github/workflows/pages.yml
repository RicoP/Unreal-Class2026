# Publish Doc/ on GitHub Pages. Doc/ is the documentation website as Tools/export_doc.mjs
# writes it: index.html, doc.js, steps.json and the steps in Doc/commits/<YYYYMMDD_HHmmss>/.
# Left out: the work in progress (commits/Transient), the source data (graph/) and the separate
# SVG files, which every doc.html already embeds.
name: Documentation website

on:
  push:
    branches: [main]
    paths:
      - "Doc/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      # Only the documentation's images, not the Unreal assets.
      - name: Fetch documentation images from Git LFS
        run: git lfs pull --include="Doc/**"
      - name: Collect the website
        run: |
          rsync -a --exclude 'commits/Transient/' --exclude 'graph/' --exclude '*.svg' Doc/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
